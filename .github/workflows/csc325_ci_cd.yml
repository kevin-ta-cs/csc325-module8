name: CSC325 CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pipeline:
    name: Backend Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Dependencies
        run: python -m pip install -r requirements.txt

      - name: Test
        run: python manage.py test --verbosity 2

      - name: Deploy
        if: github.event_name == 'push'
        run: |
          echo "Deployment placeholder — hosting is not configured yet."